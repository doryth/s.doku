<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0f1115">
<meta name="robots" content="noindex, nofollow">
<title>Sudoku</title>
<link rel="icon" href="data:,">
<style>
:root {
  --bg: #0f1115; --surface: #1a1d24; --surface-2: #232730; --line: #2c313c;
  --text: #e6e8ec; --muted: #9aa3b2; --accent: #6ea8fe; --accent-2: #4f86f7;
  --ok: #4ade80; --warn: #f87171;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--text);
  font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
}
#app { max-width: 720px; margin: 0 auto; padding: max(16px, env(safe-area-inset-top)) 16px 32px; }

/* Inputs & buttons */
input {
  background: var(--surface); border: 1px solid var(--line); color: var(--text);
  border-radius: 10px; padding: 12px 14px; font-size: 1rem; outline: none;
}
input:focus { border-color: var(--accent); }
button { cursor: pointer; border-radius: 10px; padding: 12px 16px; font-size: 1rem;
  background: var(--surface-2); color: var(--text); border: 1px solid var(--line); }
button:active { transform: translateY(1px); }
button.primary { background: var(--accent-2); color: #fff; border: none; }
button.primary:disabled { opacity: 0.6; }
.status { min-height: 1.2em; margin: 12px 0 0; font-size: 0.9rem; color: var(--muted); text-align: center; }
.status.error { color: var(--warn); }

/* Game */
.game { max-width: 460px; margin: 4vh auto 0; }
.game-title { text-align: center; font-size: 1.5rem; font-weight: 700; margin: 0 0 16px; }
.board {
  display: grid; grid-template-columns: repeat(9, 1fr); aspect-ratio: 1;
  border: 2px solid var(--text); border-radius: 6px; overflow: hidden;
  outline: none; user-select: none; -webkit-user-select: none;
}
.cell {
  display: flex; align-items: center; justify-content: center;
  font-size: clamp(1rem, 5.5vw, 1.6rem); aspect-ratio: 1;
  border: 1px solid var(--line); background: var(--surface); cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.cell.br { border-right: 2px solid var(--muted); }
.cell.bb { border-bottom: 2px solid var(--muted); }
.cell.sel { background: var(--surface-2); box-shadow: inset 0 0 0 2px var(--accent); }
.cell.bad { color: var(--warn); font-weight: 700; }
.pad { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin: 16px 0; }
.key { padding: 14px 0; font-size: 1.1rem; }
.controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.btn { flex: 1; min-width: 78px; }
.toggle { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 0.9rem; cursor: pointer; }

/* Lead card (centered) */
.card.solo { margin-top: 18vh; text-align: center; }
.card.solo h1 { font-size: 1.6rem; margin: 0 0 8px; }
.subtitle { color: var(--muted); margin: 0 0 24px; font-size: 0.9rem; }
.card.solo input { width: 100%; max-width: 360px; }
.card.solo button.primary { margin-top: 14px; width: 100%; max-width: 360px; }

/* Top bar / tabs */
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
.tabs { display: flex; gap: 6px; }
.tab { background: transparent; border: 1px solid transparent; color: var(--muted); padding: 8px 12px; }
.tab.active { background: var(--surface); color: var(--text); border-color: var(--line); }
.exit { background: transparent; border: 1px solid var(--line); color: var(--muted); padding: 8px 14px; }
.panel.hidden, .list.hidden, .hidden { display: none; }

/* List view */
.search { width: 100%; margin-bottom: 14px; }
.list { display: flex; flex-direction: column; gap: 8px; }
.note { display: flex; flex-direction: column; }
.item { display: flex; align-items: stretch; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.item:hover { border-color: var(--accent); }
.item-open { flex: 1; min-width: 0; text-align: left; background: transparent; border: none; border-radius: 0; padding: 14px 16px; color: inherit; }
.item-t { font-weight: 600; }
.item-exp { background: transparent; border: none; border-left: 1px solid var(--line); border-radius: 0; color: var(--muted); padding: 0 16px; }
.item-exp:hover { color: var(--accent); }
.item-exp .chev { display: inline-block; transition: transform .15s ease; }
.item-exp[aria-expanded="true"] .chev { transform: rotate(90deg); }
.item-body { margin: 8px 2px 4px; }
.folder-head { color: var(--muted); font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.05em; margin: 14px 0 6px; }
.folder-head:first-child { margin-top: 0; }
.reader .back { background: transparent; border: none; color: var(--accent); padding: 0 0 12px; }
.rich { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; overflow-wrap: anywhere; }
.rich :first-child { margin-top: 0; }
.rich pre { background: #0b0d11; padding: 12px; border-radius: 8px; overflow: auto; }
.rich code { background: #0b0d11; padding: 2px 5px; border-radius: 5px; }
.rich pre code { padding: 0; }
.rich a { color: var(--accent); }

/* Cards view */
.cards { display: grid; grid-template-columns: 1fr; gap: 10px; }
@media (min-width: 520px) { .cards { grid-template-columns: 1fr 1fr; } }
.tile { text-align: left; background: var(--surface); border: 1px solid var(--line); padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
.tile.copied { border-color: var(--ok); }
.tile-cap { color: var(--muted); font-size: 0.85rem; }
.big { font-size: 1.9rem; font-weight: 700; letter-spacing: 0.06em; font-variant-numeric: tabular-nums; }
.bar { height: 4px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.bar-fill { height: 100%; width: 100%; background: var(--accent); border-radius: 99px; transition: width 1s linear; }
.bar-fill.expiring { background: var(--warn); }
.empty { color: var(--muted); text-align: center; padding: 32px 12px; }

/* Overlay */
.cards-top { display: flex; justify-content: flex-end; margin-bottom: 10px; }
.out { background: var(--surface-2); border: 1px solid var(--line); color: var(--text); padding: 8px 14px; }
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex; align-items: flex-start; justify-content: center; padding: 24px 16px; overflow: auto; z-index: 50; }
.modal { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; width: 100%; max-width: 560px; }
.modal-top { display: flex; align-items: center; justify-content: space-between; }
.modal-top h2 { margin: 0; font-size: 1.2rem; }
.modal-close { background: transparent; border: none; color: var(--muted); font-size: 1.1rem; padding: 4px 8px; }
.modal h3 { margin: 20px 0 4px; font-size: 0.95rem; }
.modal .tip { color: var(--muted); font-size: 0.85rem; margin: 0 0 12px; }
.warn { color: var(--warn); font-size: 0.85rem; background: rgba(248,113,113,.1); border: 1px solid rgba(248,113,113,.3); border-radius: 8px; padding: 8px 10px; }
.pics { display: flex; flex-wrap: wrap; gap: 14px; }
.pic { display: flex; flex-direction: column; align-items: center; gap: 6px; max-width: 180px; }
.pic-box { background: #fff; padding: 8px; border-radius: 8px; width: 164px; height: 164px; }
.pic-box svg { width: 100%; height: 100%; display: block; }
.pic-cap { color: var(--muted); font-size: 0.78rem; text-align: center; overflow-wrap: anywhere; }
</style>
</head>
